version: '3'
services:
  toposoid-sentence-parser-english-web:
    image: toposoid-sentence-parser-english-web:0.7-SNAPSHOT
    tty: true
    environment:
      - TOPOSOID_CORENLP_HOST=corenlp
      - TOPOSOID_PARSER_SPACY_MODEL_EN=en_core_web_md
    ports:
      - 9007:9007
  corenlp:
    image: toposoid/corenlp:3.4.2
    ports:
      - 9000:9000
    environment:      
      - TOPOSOID_JVM_XMS=512m
      - TOPOSOID_JVM_XMX=2g
      - TOPOSOID_JVM_XSS=512k
